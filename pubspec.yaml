name: project_xp
description: "Project XP - expérience sociale gaming et RPG fantasy."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  shared_preferences: ^2.5.5
  image_picker: ^1.1.2
  path_provider: ^2.1.6
  audioplayers: ^6.8.1
  flutter_local_notifications: ^22.3.0
  cryptography: 2.9.0
  local_auth: 3.0.2
  supabase_flutter: ^2.17.2
  battery_plus: ^7.1.1
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  connectivity_plus: ^7.3.1
  flutter_blue_plus: ^2.3.12
  app_links: ^6.4.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/hall/
    - assets/images/tavern/
    - assets/audio/music/
    - assets/audio/sfx/
    - assets/images/bjorn/bjorn_idle.png
    - assets/images/avatars/male/base/
    - assets/images/avatars/male/hair/
    - assets/images/avatars/male/beard/
    - assets/images/avatars/male/glasses/
    - assets/images/avatars/male/outfit/
    - assets/images/avatars/male/accessory/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
